<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinBolo Log Viewer</title>
    <!-- The page is also served at /gamelog/<key>; this keeps logviewer.js,
         .wasm and .data loading from the site root there. -->
    <base href="/">
    <style>
        :root {
            --bg: #1a1a2e; --surface: #262640; --border: #3a3a5c;
            --text: #e0e0ff; --muted: #9a9ab8; --accent: #6c6cff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* SDL sizes the canvas to the page (SDL_SetWindowFillDocument). */
        canvas.emscripten {
            display: block;
            background: #000;
            cursor: default;
        }

        /* The progress bars, centred over the page while the viewer and the
           log download. No backdrop: clicks reach the canvas except while an
           error is showing, when a click dismisses it. */
        .overlay {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1.25rem; text-align: center;
            pointer-events: none;
            transition: opacity .4s ease, visibility .4s ease;
        }
        .overlay.hidden { opacity: 0; visibility: hidden; }
        .overlay.error { pointer-events: auto; }
        .progress { display: flex; flex-direction: column; gap: .4rem; }
        .progress.hidden { display: none; }
        .progress .label { font-size: .9rem; color: var(--muted); min-height: 1.2em; }
        .progress .label.error { color: var(--text); max-width: min(420px, 80vw); }
        .bar {
            width: min(360px, 70vw); height: 8px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 999px; overflow: hidden;
        }
        .bar .fill {
            height: 100%; width: 0;
            background: var(--accent);
            border-radius: 999px;
            transition: width .25s ease;
        }
        /* A sweep while the size is not known */
        .bar .fill.indeterminate {
            width: 35% !important;
            animation: sweep 1.1s ease-in-out infinite;
        }
        @keyframes sweep {
            0%   { margin-left: -35%; }
            100% { margin-left: 100%; }
        }

        /* Shown while a file is dragged over the page */
        #drop {
            border: 3px dashed var(--accent);
            background: rgba(26, 26, 46, .85);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"></canvas>

    <div id="loading" class="overlay">
        <div class="progress" id="app-progress">
            <div class="label" id="app-label">Loading the viewer…</div>
            <div class="bar"><div class="fill indeterminate" id="app-fill"></div></div>
        </div>
        <div class="progress hidden" id="log-progress">
            <div class="label" id="log-label">Downloading the log…</div>
            <div class="bar"><div class="fill indeterminate" id="log-fill"></div></div>
        </div>
    </div>

    <div id="drop" class="overlay hidden">Drop a .wbv file to open it</div>

    <script>
        /* One of the two bars: the viewer's own download, or the log's.
           fraction is 0..1, or null while the size is not known. */
        function setProgress(which, text, fraction) {
            var label = document.getElementById(which + '-label');
            var fill  = document.getElementById(which + '-fill');
            document.getElementById(which + '-progress').classList.remove('hidden');
            if (text !== null) label.textContent = text;
            if (fraction === null) {
                fill.classList.add('indeterminate');
            } else {
                fill.classList.remove('indeterminate');
                fill.style.width = (Math.max(0, Math.min(1, fraction)) * 100).toFixed(1) + '%';
            }
        }

        function showError(which, text) {
            var label = document.getElementById(which + '-label');
            document.getElementById(which + '-progress').classList.remove('hidden');
            label.textContent = text;
            label.classList.add('error');
            document.getElementById(which + '-fill').parentNode.style.display = 'none';
            failed = true;
            document.getElementById('loading').classList.add('error');
            document.getElementById('loading').classList.remove('hidden');
        }

        var runtimeReady = false;   /* main() is running */
        var logPending   = false;   /* a log download has been started */
        var logData      = null;    /* { data, name } waiting for the runtime */
        var failed       = false;   /* an error is on the overlay */

        /* The overlay goes once the viewer is up and any log has been handed
           to it. An error keeps it up; a click dismisses it. */
        function updateOverlay() {
            if (!failed && runtimeReady && !logPending) {
                document.getElementById('loading').classList.add('hidden');
            }
        }
        document.getElementById('loading').addEventListener('click', function() {
            if (failed && runtimeReady) this.classList.add('hidden');
        });

        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            /* Emscripten reports the data file's download as
               "... (loaded/total)". */
            setStatus: function(text) {
                if (!text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    var cur = parseFloat(m[2]), tot = parseFloat(m[4]);
                    setProgress('app', 'Loading the viewer…', tot > 0 ? cur / tot : null);
                }
            },
            monitorRunDependencies: function(left) {
                if (!left) setProgress('app', 'Starting…', 1);
            },
            onRuntimeInitialized: function() {
                runtimeReady = true;
                setProgress('app', 'Ready', 1);
                if (logData) {
                    openWbvData(logData.data, logData.name);
                    logData = null;
                    logPending = false;
                }
                updateOverlay();
            }
        };

        window.onerror = function(msg) {
            showError('app', 'Error: ' + msg);
        };

        /* Write a log to the Emscripten FS and open it */
        function openWbvData(data, displayName) {
            var filename = '/tmp/' + displayName;
            try { Module.FS.unlink(filename); } catch(err) {}
            Module.FS.writeFile(filename, data);

            var fnamePtr = Module.stringToNewUTF8(filename);
            Module._wasm_open_log_file(fnamePtr);
            Module._free(fnamePtr);
        }

        /* The log key in the page address: the path /gamelog/<key>, or the
           query ?key=<key>. Returns '' when there is none, or when the path
           is not valid percent-encoding: this runs before main(), so a throw
           here would stop the viewer starting. */
        function logKeyFromLocation() {
            var m = window.location.pathname.match(/^\/gamelog\/([^\/]+)\/?$/);
            if (m) {
                try { return decodeURIComponent(m[1]); } catch (err) { return ''; }
            }
            return new URLSearchParams(window.location.search).get('key') || '';
        }

        /* Download a WinBolo.net log by its key. /logdownload is same-origin:
           the web server passes it on to WinBolo.net. */
        function loadWbvFromKey(key) {
            loadWbvFrom('/logdownload?key=' + encodeURIComponent(key), key);
        }

        /* Download a log from a full address. A relative address resolves
           against the site root (see <base>). */
        function loadWbvFromUrl(url) {
            var last = url.split('?')[0].split('/').pop().replace(/\.wbv$/i, '');
            loadWbvFrom(url, last);
        }

        /* Fetch a log, with its own progress bar, and open it as <name>.wbv
           once the viewer is running, keeping only safe characters of name
           for its path in the Emscripten FS. Started as the page loads, so it
           downloads alongside the viewer. */
        function loadWbvFrom(fetchUrl, name) {
            var safe = (name.replace(/[^0-9A-Za-z_-]/g, '') || 'download') + '.wbv';
            logPending = true;
            setProgress('log', 'Downloading the log…', null);
            fetch(fetchUrl)
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    var total = parseInt(response.headers.get('Content-Length') || '0', 10);
                    if (!response.body || !response.body.getReader) {
                        return response.arrayBuffer().then(function(b) { return new Uint8Array(b); });
                    }
                    var reader = response.body.getReader();
                    var chunks = [], received = 0;
                    function pump() {
                        return reader.read().then(function(r) {
                            if (r.done) {
                                var out = new Uint8Array(received), pos = 0;
                                chunks.forEach(function(c) { out.set(c, pos); pos += c.length; });
                                return out;
                            }
                            chunks.push(r.value);
                            received += r.value.length;
                            setProgress('log', 'Downloading the log… ' +
                                        Math.round(received / 1024) + ' KB',
                                        total > 0 ? received / total : null);
                            return pump();
                        });
                    }
                    return pump();
                })
                .then(function(data) {
                    setProgress('log', 'Log downloaded', 1);
                    if (runtimeReady) {
                        openWbvData(data, safe);
                        logPending = false;
                    } else {
                        logData = { data: data, name: safe };
                    }
                    updateOverlay();
                })
                .catch(function(err) {
                    logPending = false;
                    showError('log', 'Could not download the log: ' + err.message);
                    console.error('Failed to load log:', err);
                });
        }

        (function() {
            var key = logKeyFromLocation();
            var url = new URLSearchParams(window.location.search).get('url');
            if (key) {
                loadWbvFromKey(key);
            } else if (url) {
                loadWbvFromUrl(url);
            }
        })();

        /* Drag and drop anywhere on the page */
        var dragDepth = 0;
        var drop = document.getElementById('drop');
        document.addEventListener('dragenter', function(e) {
            e.preventDefault();
            dragDepth++;
            drop.classList.remove('hidden');
        });
        document.addEventListener('dragover', function(e) {
            e.preventDefault();
        });
        document.addEventListener('dragleave', function(e) {
            e.preventDefault();
            if (--dragDepth <= 0) {
                dragDepth = 0;
                drop.classList.add('hidden');
            }
        });
        document.addEventListener('drop', function(e) {
            e.preventDefault();
            dragDepth = 0;
            drop.classList.add('hidden');
            var file = e.dataTransfer.files[0];
            if (file && runtimeReady) loadWbvFile(file);
        });

        function loadWbvFile(file) {
            var reader = new FileReader();
            reader.onload = function(ev) {
                openWbvData(new Uint8Array(ev.target.result), file.name);
            };
            reader.readAsArrayBuffer(file);
        }
    </script>

    {{{ SCRIPT }}}
</body>
</html>
