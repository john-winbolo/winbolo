<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinBolo Log Viewer</title>
    <!-- The page is also served at /gamelog/<key>; this keeps logviewer.js,
         .wasm and .data loading from the site root there. -->
    <base href="/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            margin: 12px 0 4px;
            font-size: 1.3em;
            color: #e0e0ff;
        }
        #status {
            margin: 4px 0 8px;
            font-size: 0.85em;
            color: #888;
            min-height: 1.2em;
        }
        .emscripten {
            padding-right: 0;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        canvas.emscripten {
            border: 1px solid #333;
            background: #000;
            cursor: default;
            width: 800px;
            height: 633px;
        }
        .drop-zone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 16px 24px;
            margin: 8px 0;
            text-align: center;
            color: #888;
            font-size: 0.9em;
            transition: border-color 0.2s, color 0.2s;
        }
        .drop-zone.active {
            border-color: #6c6cff;
            color: #aaa;
        }
        .drop-zone p { margin: 4px 0; }
    </style>
</head>
<body>
    <h1>WinBolo Log Viewer</h1>
    <div id="status">Loading...</div>

    <div class="drop-zone" id="drop-zone">
        <p>Drag and drop a <strong>.wbv</strong> file here</p>
        <p>or use File &rarr; Open in the menu</p>
    </div>

    <canvas class="emscripten" id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex="-1"
            width="800" height="608"></canvas>

    <script>
        var Module = {
            canvas: (function() { return document.getElementById('canvas'); })(),
            setStatus: function(text) {
                var el = document.getElementById('status');
                if (el) el.textContent = text;
            },
            monitorRunDependencies: function(left) {
                if (left) {
                    Module.setStatus('Loading... (' + left + ' files remaining)');
                } else {
                    Module.setStatus('Ready');
                }
            },
            onRuntimeInitialized: function() {
                Module.setStatus('Ready');
                /* Debug: check canvas state */
                var c = document.getElementById('canvas');
                console.log('[WASM] Canvas after init:', c.width, 'x', c.height, 'style:', c.style.cssText);

                /* A WinBolo.net log key, from /gamelog/<key> or ?key=<key>,
                   or a full download address from ?url=<url> */
                var key = logKeyFromLocation();
                var url = new URLSearchParams(window.location.search).get('url');
                if (key) {
                    loadWbvFromKey(key);
                } else if (url) {
                    loadWbvFromUrl(url);
                }
            }
        };

        Module.setStatus('Downloading...');

        window.onerror = function(msg, url, line, col, error) {
            console.error('window.onerror:', msg, url, line, col, error);
            Module.setStatus('Error: ' + msg);
        };

        /* Helper: write data to Emscripten FS and open it */
        function openWbvData(data, displayName) {
            var filename = '/tmp/' + displayName;
            try { Module.FS.unlink(filename); } catch(err) {}
            Module.FS.writeFile(filename, data);

            var fnamePtr = Module.stringToNewUTF8(filename);
            Module._wasm_open_log_file(fnamePtr);
            Module._free(fnamePtr);
            Module.setStatus('Loaded: ' + displayName);
        }

        /* The log key in the page address: the path /gamelog/<key>, or the
           query ?key=<key>. Returns '' when there is none, or when the path
           is not valid percent-encoding: this runs before main(), so a throw
           here would stop the viewer starting. */
        function logKeyFromLocation() {
            var m = window.location.pathname.match(/^\/gamelog\/([^\/]+)\/?$/);
            if (m) {
                try { return decodeURIComponent(m[1]); } catch (err) { return ''; }
            }
            return new URLSearchParams(window.location.search).get('key') || '';
        }

        /* Download a WinBolo.net log by its key and open it. /logdownload is
           same-origin: the web server passes it on to WinBolo.net. */
        function loadWbvFromKey(key) {
            loadWbvFrom('/logdownload?key=' + encodeURIComponent(key), key);
        }

        /* Download a log from a full address and open it. A relative address
           resolves against the site root (see <base>). */
        function loadWbvFromUrl(url) {
            var last = url.split('?')[0].split('/').pop().replace(/\.wbv$/i, '');
            loadWbvFrom(url, last);
        }

        /* Fetch a log and open it as <name>.wbv, keeping only safe characters
           of name for its path in the Emscripten FS. */
        function loadWbvFrom(fetchUrl, name) {
            Module.setStatus('Downloading log file...');
            fetch(fetchUrl)
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.arrayBuffer();
                })
                .then(function(buffer) {
                    var data = new Uint8Array(buffer);
                    var safe = name.replace(/[^0-9A-Za-z_-]/g, '') || 'download';
                    openWbvData(data, safe + '.wbv');
                })
                .catch(function(err) {
                    Module.setStatus('Error loading log: ' + err.message);
                    console.error('Failed to load log:', err);
                });
        }

        /* Drag-and-drop support */
        var dropZone = document.getElementById('drop-zone');

        ['dragenter', 'dragover'].forEach(function(evt) {
            dropZone.addEventListener(evt, function(e) {
                e.preventDefault();
                dropZone.classList.add('active');
            });
        });
        ['dragleave', 'drop'].forEach(function(evt) {
            dropZone.addEventListener(evt, function(e) {
                e.preventDefault();
                dropZone.classList.remove('active');
            });
        });

        dropZone.addEventListener('drop', function(e) {
            var file = e.dataTransfer.files[0];
            if (!file) return;
            loadWbvFile(file);
        });

        function loadWbvFile(file) {
            Module.setStatus('Loading ' + file.name + '...');
            var reader = new FileReader();
            reader.onload = function(ev) {
                var data = new Uint8Array(ev.target.result);
                openWbvData(data, file.name);
            };
            reader.readAsArrayBuffer(file);
        }
    </script>

    {{{ SCRIPT }}}
</body>
</html>
