<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play WinBolo — the classic multiplayer tank game</title>
    <meta name="description" content="Play WinBolo in your browser. Jump into a live multiplayer game, run the tutorial, or practise solo — no download required.">
    <meta name="theme-color" content="#13150e">
    <link rel="apple-touch-icon" href="/img/favicon.png">
    <meta property="og:site_name" content="Play WinBolo">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://play.winbolo.net/">
    <meta property="og:title" content="Play WinBolo">
    <meta property="og:description" content="Play WinBolo in your browser — live multiplayer, tutorial, or solo practise.">
    <meta property="og:image" content="https://play.winbolo.net/img/wb2-og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Clean URLs (/tutorial, /join/<token>) are served by rewriting this
         shell at a sub-path, so relative assets must resolve from the root. -->
    <base href="/">
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <style>
        :root {
            --bg:#13150e; --surface2:#262b1f; --border:#39402e;
            --text:#e9e8de; --muted:#9aa086; --accent:#ef8430;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Stage holds the canvas + loading overlay */
        .stage {
            position: relative; flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .emscripten { display: block; margin: 0 auto; }
        canvas.emscripten {
            background: #000;
            cursor: default;
            /* No fixed width/height or border — SDL sizes the canvas to the page */
        }

        /* Loading overlay */
        .loading {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1rem; text-align: center;
            background: radial-gradient(circle at 50% 40%, rgba(38,43,31,.92), rgba(19,21,14,.97));
            transition: opacity .5s ease, visibility .5s ease;
        }
        .loading.hidden { opacity: 0; visibility: hidden; }
        .loading .logo { height: 96px; filter: drop-shadow(0 4px 24px rgba(0,0,0,.6)); }
        #status { font-size: .9rem; color: var(--muted); min-height: 1.2em; }
        .bar {
            width: min(360px, 70vw); height: 8px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 999px; overflow: hidden;
        }
        #bar-fill {
            height: 100%; width: 0;
            background: var(--accent);
            border-radius: 999px;
            transition: width .25s ease;
        }
        /* Indeterminate sweep before a real fraction is known */
        #bar-fill.indeterminate {
            width: 35% !important;
            animation: sweep 1.1s ease-in-out infinite;
        }
        @keyframes sweep {
            0%   { margin-left: -35%; }
            100% { margin-left: 100%; }
        }
    </style>
    <script>
    /* Clean-URL support. The game reads its mode from window.location.search,
       both here and from compiled C (emscripten_run_script_string runs
       "new URLSearchParams(window.location.search).get(...)"). When this shell
       is served at a clean path — /tutorial or /join/<token>, which Caddy
       rewrites to the shell with no query string — derive the equivalent
       params from the path and make URLSearchParams surface them. Every
       existing reader then works unchanged and the address bar stays clean.
       Accessing /winbolo.html?... directly still works (injected stays empty,
       so the override is skipped and the real query string is used). */
    (function () {
        var path = decodeURIComponent(window.location.pathname);
        var injected = {}, m;
        if (path === '/tutorial') {
            injected.tutorial = '1';
        } else if (path === '/practise') {
            injected.practise = '1';
        } else if ((m = path.match(/^\/join\/(.+)$/))) {
            injected.game_key = m[1];
        }
        // / injects nothing; the game tells it apart from /practise by the
        // practise param. Both start single player for now.
        if (Object.keys(injected).length === 0) return;

        var Native = window.URLSearchParams;
        function Patched(init) {
            var sp = new Native(init);
            var nativeGet = sp.get.bind(sp);
            sp.get = function (key) {
                var v = nativeGet(key);
                return (v === null || v === '') && (key in injected) ? injected[key] : v;
            };
            return sp;
        }
        Patched.prototype = Native.prototype;
        window.URLSearchParams = Patched;
    })();
    </script>
    <script>
    /* Probe login state as early as possible. wbPrefsHasAuth() reads
       WB_PREFS_AUTH when the WASM bootstrap prefs sync runs in main(). Start
       optimistic (true): normally this fetch resolves long before main() and
       sets the real value, but if the 203 MB asset bundle is cached, main()
       can run first — staying optimistic means a logged-in player's saved prefs
       still download (the server is the source of truth), while an anonymous
       visitor just gets one harmless 401 that flips the flag off via
       wbPrefsOnReauth. */
    window.WB_PREFS_AUTH = true;
    window.__wbMe = fetch('/api/v1/me', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
            window.WB_PREFS_AUTH = !!(me && me.logged_in);
            /* Expose the account name so the WASM client can use it as the JOIN
               name (read synchronously from C before connecting). */
            window.WB_PREFS_NAME = (me && me.logged_in && me.username) ? me.username : '';
            return me;
        })
        .catch(function () { return me_unknown(); });

    // On probe failure leave the flag optimistic rather than forcing it off.
    function me_unknown() { return null; }
    </script>
    <script src="/js/relay.js"></script>
    <script>
    /* Pick the closest healthy relay as early as possible, so the choice is
       ready before the game opens its socket. Runs in parallel with the asset
       download; the winner lands in WB_RELAY and is consumed by wbMintJoinCode
       when it points the game socket at a relay. Never rejects — an all-down
       probe resolves to the default. */
    window.WB_RELAY = null;
    window.__wbRelayReady = (function () {
        // Only web play (a /join/<game_key> route) needs a relay; tutorial,
        // practise, single-player and the dev proxy skip the probe entirely.
        if (!new URLSearchParams(window.location.search).get('game_key')) {
            return Promise.resolve(null);
        }
        return wbProbeRelays().then(function (region) {
            window.WB_RELAY = region || WB_DEFAULT;
            return window.WB_RELAY;
        }).catch(function () {
            window.WB_RELAY = WB_DEFAULT;
            return window.WB_RELAY;
        });
    })();
    </script>
</head>
<body>
    <main class="stage">
        <canvas class="emscripten" id="canvas"
                oncontextmenu="event.preventDefault()"
                tabindex="0"></canvas>

        <div id="loading" class="loading">
            <img class="logo" src="/img/wb2-logo.png" alt="WinBolo">
            <div id="status">Loading…</div>
            <div class="bar"><div id="bar-fill" class="indeterminate"></div></div>
        </div>
    </main>

    <script>
        var Module = {
            /* WebSocket transport for the emulated UDP socket. sockfs reads
               Module.websocket.url when the socket opens (inside the C connect,
               after the mint returns), so the URL can be filled in late:
                 - production web play: wbMintJoinCode() mints the single-use
                   code and points this at the probed relay just before connect.
                 - ?proxyURL=<wsurl>  : dev/LAN escape hatch, used verbatim.
               Start with the dev proxy (or empty); the mint fills it in.

               subprotocol: null offers no Sec-WebSocket-Protocol at all.
               Left unset, sockfs falls back to WEBSOCKET_SUBPROTOCOL
               ("binary"), and RFC 6455 then obliges the browser to fail
               any handshake whose 101 does not echo that back. The relay
               does not echo it, which Chrome and Edge treat as fatal
               (Firefox does not) — and since the relay has already
               resolved and consumed the single-use join code by then, the
               retry that follows dies on "join code already used".
               A literal null makes sockfs pass no protocol list to the
               WebSocket constructor, so there is nothing to echo. */
            websocket: (function() {
                var devProxy = new URLSearchParams(window.location.search).get('proxyURL');
                return { url: devProxy || '', subprotocol: null };
            })(),
            canvas: (function() { return document.getElementById('canvas'); })(),
            print: function(text) {
                /* Console only. The on-page log panel this used to append to is
                   gone; devtools is where anyone who wants this will look, and
                   printErr below has always gone there and nowhere else. */
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            setStatus: function(text) {
                var statusEl = document.getElementById('status');
                var fill = document.getElementById('bar-fill');
                /* emscripten reports download progress as "... (loaded/total)";
                   parse it to drive the bar, otherwise run it indeterminate. */
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var pct = null;
                if (m) {
                    var cur = parseFloat(m[2]), tot = parseFloat(m[4]);
                    text = m[1].trim();
                    if (tot > 0) pct = Math.max(0, Math.min(100, (cur / tot) * 100));
                }
                if (statusEl) statusEl.textContent = text || 'Ready';
                if (fill) {
                    if (pct !== null) {
                        fill.classList.remove('indeterminate');
                        fill.style.width = pct.toFixed(1) + '%';
                    } else {
                        fill.classList.add('indeterminate');
                    }
                }
            },
            monitorRunDependencies: function(left) {
                if (left) {
                    Module.setStatus('Loading game data… (' + left + ' to go)');
                } else {
                    Module.setStatus('Ready');
                }
            },
            onRuntimeInitialized: function() {
                Module.setStatus('Running');
                var loading = document.getElementById('loading');
                if (loading) loading.classList.add('hidden');
                var c = document.getElementById('canvas');
                console.log('[WASM] Canvas after init:', c.width, 'x', c.height);
                /* Mouse wheel -> gunsight. SDL3's emscripten wheel callback
                   doesn't fire on the canvas in this build, so deliver it
                   ourselves: preventDefault stops the page scrolling, and
                   wbWasmWheel injects a native SDL wheel event for the shared
                   in-game handler (which gates on running-game + ImGui focus). */
                if (c) {
                    c.addEventListener('wheel', function(e) {
                        e.preventDefault();
                        try { Module.ccall('wbWasmWheel', null, ['number'], [e.deltaY]); }
                        catch (_) {}
                    }, { passive: false });
                }
                /* Held-key safety reset. A browser can stop delivering keyup
                   without any SDL focus event (tab hidden, window blurred),
                   leaving a movement key latched in SDL's polled keyboard
                   state and the tank turning with nothing pressed. Clear it
                   from the DOM side on both paths. */
                var wbResetHeldKeys = function() {
                    try { Module.ccall('wbWasmResetHeldKeys', null, [], []); }
                    catch (_) {}
                };
                document.addEventListener('visibilitychange', function() {
                    if (document.hidden) wbResetHeldKeys();
                });
                window.addEventListener('blur', wbResetHeldKeys);
            },

            /* ---- WinBolo.net preferences bridge -----------------------------
               Called from prefs_bridge_wasm.c via EM_ASYNC_JS. The API lives at
               the same origin (Caddy proxies /api/* on play.winbolo.net), so
               these are plain same-origin fetches that carry the session cookie
               — no CORS, no bearer token. Each HTTP helper resolves to
               { status, body } where body is the raw response text. */
            wbPrefsHasAuth: function() {
                return window.WB_PREFS_AUTH === true;
            },
            wbPrefsHttpGet: function() {
                return fetch('/api/v1/prefs', {
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/json' }
                }).then(function(r) {
                    return r.text().then(function(b) { return { status: r.status, body: b }; });
                });
            },
            wbPrefsHttpPut: function(reqBody) {
                return fetch('/api/v1/prefs', {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: reqBody
                }).then(function(r) {
                    return r.text().then(function(b) { return { status: r.status, body: b }; });
                });
            },
            wbPrefsOnReauth: function() {
                // Session expired mid-game: stop syncing.
                window.WB_PREFS_AUTH = false;
            },

            /* ---- Round-log download (the recap reel's WinBolo.net source) ---
               Called from round_log_fetch_wasm.c. A round a WinBolo.net-
               registered host uploaded is served from /logdownload, which needs
               no authentication and is proxied on this origin beside /api/*, so
               no signing key and no CORS.

               Unlike the prefs helpers above, body is NOT text: a round log is a
               zip, and reading it as text would corrupt it. Resolves
               { status, body } with body a Uint8Array, or null when there is
               nothing to take — including on a rejected or aborted fetch, which
               resolves status -1 rather than throwing. The caller passes the
               AbortSignal it cancels with. */
            wbRoundLogFetch: function(key, signal) {
                return fetch('/logdownload?key=' + encodeURIComponent(key), {
                    credentials: 'same-origin',
                    signal: signal
                }).then(function(r) {
                    if (!r.ok) { return { status: r.status, body: null }; }
                    return r.arrayBuffer().then(function(b) {
                        return { status: r.status, body: new Uint8Array(b) };
                    });
                }).catch(function() {
                    return { status: -1, body: null };
                });
            },

            /* ---- Join-code mint (relay routing + WBN token) -----------------
               Called from gamefront_wasm.c (wasmMintJoinCode / EM_ASYNC_JS) just
               before the game opens its socket. Mints a fresh single-use code
               for game_key via POST /api/join (same-origin, session cookie),
               points the game socket at the probed relay, and resolves
               { status, code, error } for the C caller. One mint per connect —
               a refresh or failover re-runs this and mints anew. */
            wbMintJoinCode: function(gameKey) {
                return fetch('/api/join', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ game_key: gameKey })
                }).then(function(r) {
                    if (r.status === 401) {
                        // Logged out (e.g. a shared /join link opened cold):
                        // send to login and come back here to try again.
                        window.location.href = 'https://www.winbolo.net/login?return=' +
                            encodeURIComponent(window.location.href);
                        return { status: 401, code: '', error: 'Sign in to join.' };
                    }
                    return r.text().then(function(body) {
                        var code = '', error = '';
                        try {
                            var j = JSON.parse(body);
                            if (j && j.join_code) { code = j.join_code; }
                            if (j && j.error) { error = j.error; }
                        } catch (e) { error = body; }
                        if (r.status === 200 && code) {
                            // Route the game socket through the probed relay before
                            // resolving — the socket opens right after the C caller
                            // gets the code. Wait for the probe (already resolved in
                            // practice) so the measured relay wins, not the default.
                            return Promise.resolve(window.__wbRelayReady).then(function() {
                                var region = window.WB_RELAY || WB_DEFAULT;
                                Module.websocket.url = wbRelayWsUrl(region, code);
                                return { status: 200, code: code, error: '' };
                            });
                        }
                        return { status: r.status, code: code, error: error };
                    });
                }).catch(function() {
                    return { status: -1, code: '', error: 'Could not reach the server to get a join code.' };
                });
            },

            /* Called from the transport (transport_udp_client.c) whenever the
               server rotates its key — on initial join and on each return-to-
               lobby. Keep the address bar on the live game so a copied link, or a
               reload after a dropped connection, mints into the current game. No
               reload; the open connection is untouched. */
            wbOnGameKey: function(gameKey) {
                if (!gameKey) { return; }
                try { history.replaceState(null, '', '/join/' + encodeURIComponent(gameKey)); }
                catch (e) {}
            }
        };

        Module.setStatus('Downloading…');

        window.onerror = function(msg, url, line, col, error) {
            console.error('window.onerror:', msg, url, line, col, error);
            Module.setStatus('Error: ' + msg);
        };

        /* Prevent the browser from intercepting Ctrl+key shortcuts so they
           reach the WASM SDL event loop instead. */
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && !e.altKey && !e.metaKey) {
                var k = e.key.toLowerCase();
                /* The sdl3imgui.cpp Ctrl shortcuts, plus the keys pressed while
                   Left Ctrl is held as the default overview zoom modifier:
                   driving on E/D/S/F and zooming on = and - (Ctrl++ arrives
                   as '='). */
                if ('mksga123pbro,def=-'.indexOf(k) !== -1) {
                    e.preventDefault();
                }
            }
        }, true);

        /* Auto-focus the canvas so keyboard events work immediately. */
        window.addEventListener('load', function() {
            document.getElementById('canvas').focus();
        });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
