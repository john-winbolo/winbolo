<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinBolo</title>
    <!-- Clean URLs (/tutorial, /join/<token>) are served by rewriting this
         shell at a sub-path, so relative assets must resolve from the root. -->
    <base href="/">
    <style>
        :root {
            --bg:#13150e; --surface:#1e221a; --surface2:#262b1f; --border:#39402e;
            --text:#e9e8de; --muted:#9aa086; --chrome:#0e110a;
            --link:#52bdba; --accent:#ef8430; --gold:#d8b454;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; padding: .6rem 1rem;
            background: var(--chrome); border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: baseline; gap: .5rem; }
        .brand .mark {
            font-weight: 800; letter-spacing: .04em; font-size: 1.15rem;
            color: var(--gold); text-transform: uppercase;
        }
        .brand .by { font-size: .72rem; color: var(--muted); }
        #netinfo {
            font-size: .76rem; color: var(--muted);
            border: 1px solid var(--border); border-radius: 999px;
            padding: .25rem .7rem; white-space: nowrap; min-height: 1em;
        }

        /* Stage holds the canvas + loading overlay */
        .stage {
            position: relative; flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .emscripten { display: block; margin: 0 auto; }
        canvas.emscripten {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #000;
            cursor: default;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
            /* No fixed width/height — SDL manages the canvas size */
        }

        /* Loading overlay */
        .loading {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 1rem; text-align: center;
            background: radial-gradient(circle at 50% 40%, rgba(38,43,31,.92), rgba(19,21,14,.97));
            transition: opacity .5s ease, visibility .5s ease;
        }
        .loading.hidden { opacity: 0; visibility: hidden; }
        .loading .mark {
            font-weight: 800; letter-spacing: .06em; font-size: 2.4rem;
            color: var(--gold); text-transform: uppercase;
            text-shadow: 0 4px 24px rgba(0,0,0,.6);
        }
        #status { font-size: .9rem; color: var(--muted); min-height: 1.2em; }
        .bar {
            width: min(360px, 70vw); height: 8px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 999px; overflow: hidden;
        }
        #bar-fill {
            height: 100%; width: 0;
            background: var(--accent);
            border-radius: 999px;
            transition: width .25s ease;
        }
        /* Indeterminate sweep before a real fraction is known */
        #bar-fill.indeterminate {
            width: 35% !important;
            animation: sweep 1.1s ease-in-out infinite;
        }
        @keyframes sweep {
            0%   { margin-left: -35%; }
            100% { margin-left: 100%; }
        }

        /* Collapsible log */
        .log {
            border-top: 1px solid var(--border);
            background: var(--chrome);
            font-size: .75rem;
        }
        .log summary {
            cursor: pointer; padding: .4rem 1rem; color: var(--muted);
            list-style: none; user-select: none;
        }
        .log summary::-webkit-details-marker { display: none; }
        #output {
            max-height: 140px; overflow-y: auto;
            font-family: "Courier New", monospace; color: var(--muted);
            padding: 0 1rem .6rem; white-space: pre-wrap;
        }
    </style>
    <script>
    /* Clean-URL support. The game reads its mode from window.location.search,
       both here and from compiled C (emscripten_run_script_string runs
       "new URLSearchParams(window.location.search).get(...)"). When this shell
       is served at a clean path — /tutorial or /join/<token>, which Caddy
       rewrites to the shell with no query string — derive the equivalent
       params from the path and make URLSearchParams surface them. Every
       existing reader then works unchanged and the address bar stays clean.
       Accessing /winbolo.html?... directly still works (injected stays empty,
       so the override is skipped and the real query string is used). */
    (function () {
        var path = decodeURIComponent(window.location.pathname);
        var injected = {}, m;
        if (path === '/tutorial') {
            injected.tutorial = '1';
        } else if ((m = path.match(/^\/join\/(.+)$/))) {
            injected.join_code = m[1];
        }
        // /practise and / fall through to single-player (no params).
        if (Object.keys(injected).length === 0) return;

        var Native = window.URLSearchParams;
        function Patched(init) {
            var sp = new Native(init);
            var nativeGet = sp.get.bind(sp);
            sp.get = function (key) {
                var v = nativeGet(key);
                return (v === null || v === '') && (key in injected) ? injected[key] : v;
            };
            return sp;
        }
        Patched.prototype = Native.prototype;
        window.URLSearchParams = Patched;
    })();
    </script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="mark">WinBolo</span>
            <span class="by">the classic multiplayer tank game</span>
        </div>
        <div id="netinfo"></div>
    </header>

    <main class="stage">
        <canvas class="emscripten" id="canvas"
                oncontextmenu="event.preventDefault()"
                tabindex="0"></canvas>

        <div id="loading" class="loading">
            <div class="mark">WinBolo</div>
            <div id="status">Loading…</div>
            <div class="bar"><div id="bar-fill" class="indeterminate"></div></div>
        </div>
    </main>

    <details class="log">
        <summary>Show log</summary>
        <div id="output"></div>
    </details>

    <script>
        var Module = {
            /* WebSocket transport for the emulated UDP socket. emscripten's
               sockfs uses a full Module.websocket.url verbatim (it only
               appends host:port to a bare "ws://"/"wss://" prefix), so the
               game socket's host:port is irrelevant — routing lives in the
               join_code carried by this URL.
                 - ?join_code=<code>  : production web play via the relay.
                 - ?proxyURL=<wsurl>  : dev/LAN escape hatch (explicit URL).
               Must be set here, in the Module literal, so it is present when
               the runtime initialises SOCKFS. */
            websocket: (function() {
                var params = new URLSearchParams(window.location.search);
                var joinCode = params.get('join_code');
                if (joinCode) {
                    return { url: 'wss://relay.winbolo.net/proxy?joinCode=' +
                                  encodeURIComponent(joinCode) };
                }
                var devProxy = params.get('proxyURL');
                if (devProxy) {
                    return { url: devProxy };
                }
                return {};
            })(),
            canvas: (function() { return document.getElementById('canvas'); })(),
            print: (function() {
                var outputElement = document.getElementById('output');
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (outputElement) {
                        outputElement.textContent += text + '\n';
                        outputElement.scrollTop = outputElement.scrollHeight;
                    }
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            setStatus: function(text) {
                var statusEl = document.getElementById('status');
                var fill = document.getElementById('bar-fill');
                /* emscripten reports download progress as "... (loaded/total)";
                   parse it to drive the bar, otherwise run it indeterminate. */
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var pct = null;
                if (m) {
                    var cur = parseFloat(m[2]), tot = parseFloat(m[4]);
                    text = m[1].trim();
                    if (tot > 0) pct = Math.max(0, Math.min(100, (cur / tot) * 100));
                }
                if (statusEl) statusEl.textContent = text || 'Ready';
                if (fill) {
                    if (pct !== null) {
                        fill.classList.remove('indeterminate');
                        fill.style.width = pct.toFixed(1) + '%';
                    } else {
                        fill.classList.add('indeterminate');
                    }
                }
            },
            monitorRunDependencies: function(left) {
                if (left) {
                    Module.setStatus('Loading game data… (' + left + ' to go)');
                } else {
                    Module.setStatus('Ready');
                }
            },
            onRuntimeInitialized: function() {
                Module.setStatus('Running');
                var loading = document.getElementById('loading');
                if (loading) loading.classList.add('hidden');
                var c = document.getElementById('canvas');
                console.log('[WASM] Canvas after init:', c.width, 'x', c.height);
            }
        };

        Module.setStatus('Downloading…');

        window.onerror = function(msg, url, line, col, error) {
            console.error('window.onerror:', msg, url, line, col, error);
            Module.setStatus('Error: ' + msg);
        };

        /* Show network mode info based on URL params */
        (function() {
            var params = new URLSearchParams(window.location.search);
            var el = document.getElementById('netinfo');
            if (!el) return;
            if (params.get('join_code')) {
                el.textContent = '● Network: web play via relay';
            } else if (params.get('proxyURL')) {
                el.textContent = '● Network: UDP via proxy — ' +
                    params.get('proxyURL');
            } else {
                el.textContent = '○ Network: single-player';
            }
        })();

        /* Prevent the browser from intercepting Ctrl+key shortcuts so they
           reach the WASM SDL event loop instead. */
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && !e.altKey && !e.metaKey) {
                var k = e.key.toLowerCase();
                /* Keys used by sdl3imgui.cpp shortcuts */
                if ('mksga123pbhr'.indexOf(k) !== -1) {
                    e.preventDefault();
                }
            }
        }, true);

        /* Auto-focus the canvas so keyboard events work immediately. */
        window.addEventListener('load', function() {
            document.getElementById('canvas').focus();
        });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
