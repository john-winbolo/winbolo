<?xml version="1.0" encoding="utf-8"?>
<!-- Export control on the recap's highlight clip rows. The conventional
     picture glyph: a frame with a sun and two mountain peaks inside it. Three flat
     shapes, no strokes and no gradients, so it survives being rasterised at
     18px — the frame is a rounded rect with its middle cut out by
     fill-rule="evenodd" rather than a stroked outline, which would thin out
     unevenly at that size. The art fills the viewBox to the same margins as
     skull.svg, because imguiLoadSvgIconWhite scales by the declared page
     rather than the drawn bounds and art that floats in the canvas renders
     lighter than its neighbours. The peaks stand on the frame's inner bottom
     edge and the sun sits clear of the left slope, so neither merges into the
     other where they meet. Rendered as a white alpha mask and tinted at draw
     time. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000000">
  <path fill-rule="evenodd" d="M4 2.5 h16 A2.5 2.5 0 0 1 22.5 5 v14 a2.5 2.5 0 0 1-2.5 2.5 h-16 A2.5 2.5 0 0 1 1.5 19 V5 A2.5 2.5 0 0 1 4 2.5 Z M3.5 5 v14 c0 0.28 0.22 0.5 0.5 0.5 h16 c0.28 0 0.5-0.22 0.5-0.5 V5 c0-0.28-0.22-0.5-0.5-0.5 h-16 c-0.28 0-0.5 0.22-0.5 0.5 Z"/>
  <circle cx="7.8" cy="8.8" r="2"/>
  <path d="M4.1 19.5 L10.3 11.3 L14 15.9 L16.6 12.8 L20 19.5 Z"/>
</svg>
