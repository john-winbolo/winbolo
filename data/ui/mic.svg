<?xml version="1.0" encoding="utf-8"?>
<!-- Microphone: capsule, cradle and stand. Drawn as one filled silhouette
     because imguiLoadSvgIconWhite rasterises it to a white alpha mask and
     tints it, so nothing here may depend on colour to be read. The three
     subpaths do not overlap, which is what lets mic-muted.svg reuse the
     same geometry with fill-rule="evenodd" to knock its slash through. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000000">
