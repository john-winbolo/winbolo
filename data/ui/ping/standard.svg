<?xml version="1.0" encoding="utf-8"?>
<!-- Smart ping: the plain marker, the one the centre of the pie sends.
     A map pin with its hole cut out by fill-rule="evenodd" — one filled
     shape, no strokes, so it survives being rasterised down to the size of
     a map square. Authored solid black and used as an alpha mask: every
     drawer forces the colour channels white and tints from the kind table
     in src/gui/ping_kinds.h, so the fill here is never what reaches the
     screen. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000000">
  <path fill-rule="evenodd" d="M12 1 C7.58 1 4 4.58 4 9 C4 15 12 23 12 23 C12 23 20 15 20 9 C20 4.58 16.42 1 12 1 Z M12 6 A3 3 0 1 1 12 12 A3 3 0 1 1 12 6 Z"/>
</svg>
