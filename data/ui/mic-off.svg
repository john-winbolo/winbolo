<?xml version="1.0" encoding="utf-8"?>
<!-- No microphone: mic.svg with the capsule drawn as an outline, so the icon
     still reads as a microphone but an empty one. The capsule is a little
     wider than mic.svg's and the ring 1.8 units thick, so the hollow stays
     open when rasterised to 16 px. Its two subpaths use fill-rule="evenodd"
     to cut the hole, because nanosvg rasterises the icon to a single-colour
     mask. Distinct from mic-muted.svg (slashed) and mic-disabled.svg (X). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="#000000">
  <path fill-rule="evenodd" d="M12 1.5a3.5 3.5 0 0 1 3.5 3.5v6a3.5 3.5 0 0 1-7 0V5a3.5 3.5 0 0 1 3.5-3.5z
                               M12 3.3a1.7 1.7 0 0 0-1.7 1.7v6a1.7 1.7 0 0 0 3.4 0V5a1.7 1.7 0 0 0-1.7-1.7z"/>
  <path d="M5 10v1a7 7 0 0 0 14 0v-1h-2v1a5 5 0 0 1-10 0v-1H5z"/>
  <path d="M11 18h2v2h3v2H8v-2h3v-2z"/>
</svg>
