  <path d="M3.17 0 L20.83 0 L20.83 10.8 L19.68 15.6 L17.57 19.44 L14.88 22.32 L12 24 L9.12 22.32 L6.43 19.44 L4.32 15.6 L3.17 10.8 Z"/>
</svg>
