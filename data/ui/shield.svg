<!-- WinBolo crest shield. Outline traces the same silhouette as the
     procedural shield in imguiDrawSpinningShield (imgui_dialog_utils.h):
     a narrow heater shield (width ~0.80 of height) whose straight
     shoulders stop high up before curving to the bottom point. Art fills
     the full 24px height so the filled signed-in badge matches the size
     of the hollow signed-out sign-in CTA. Rendered as a white alpha mask
     by imguiLoadSvgIconWhite; tinted gold for supporters. -->
