  <path fill-rule="evenodd" d="M12 1.5 C6.75 1.5 2.5 5.75 2.5 11 v4.3 c0 1.05 0.85 1.9 1.9 1.9 h15.2 c1.05 0 1.9-0.85 1.9-1.9 V11 C21.5 5.75 17.25 1.5 12 1.5 Z M5.6 11 a2.9 2.9 0 1 1 5.8 0 a2.9 2.9 0 1 1-5.8 0 Z M12.6 11 a2.9 2.9 0 1 1 5.8 0 a2.9 2.9 0 1 1-5.8 0 Z M12 16.4 L10.35 13.5 L13.65 13.5 Z"/>
  <path d="M7.6 18.8 h8.8 l-0.8 2.35 c-0.3 0.86-1.11 1.45-2.02 1.45 h-3.16 c-0.91 0-1.72-0.59-2.02-1.45 Z"/>
