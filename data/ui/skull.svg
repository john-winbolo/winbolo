<!-- Death marker for the recap scoreboard's Deaths / LGM Deaths columns.
     Two flat shapes, no strokes and no gradients, so it survives being
     rasterised small: a cranium whose eye sockets and nose are cut out with
     fill-rule="evenodd", and the mandible below it as a separate shape — the
     gap between the two reads as the mouth line at 18px, where drawn teeth
     would blur into a smear. Rendered as a white alpha mask by
     imguiLoadSvgIconWhite and tinted at draw time. -->
